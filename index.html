<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RG GAMER BOY FF — Create Account</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#0b0b0e;
    --card:#15151a;
    --field:#0d0d10;
    --text:#f5f5f7;
    --muted:#9b9ba3;
    --line:#292930;
    --accent:#e52b3f;
    --accent2:#ff5363;
  }
  body{
    margin:0;
    min-height:100vh;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 50% -10%, rgba(229,43,63,.25), transparent 38%),
      linear-gradient(180deg,#1a0b0e 0%,var(--bg) 30%,#070709 100%);
  }
  .topbar{
    height:7px;
    background:linear-gradient(90deg,#9e1525,var(--accent),#ff6977);
  }
  .wrap{
    width:min(94%,520px);
    margin:38px auto 28px;
  }
  .brand{
    text-align:center;
    margin-bottom:22px;
  }
  .logo{
    width:86px;height:86px;
    margin:0 auto 14px;
    border-radius:25px;
    display:grid;
    place-items:center;
    font-size:52px;
    font-weight:900;
    letter-spacing:-5px;
    color:white;
    background:linear-gradient(145deg,#1c1c22,#08080a);
    border:1px solid #36363e;
    box-shadow:0 18px 45px rgba(0,0,0,.45),0 0 35px rgba(229,43,63,.16);
  }
  h1{
    margin:0;
    font-size:29px;
    letter-spacing:.3px;
  }
  .brand p{
    margin:7px 0 0;
    color:var(--muted);
    font-size:14px;
  }
  .card{
    background:rgba(21,21,26,.96);
    border:1px solid #303039;
    border-radius:25px;
    padding:27px 22px 24px;
    box-shadow:0 24px 70px rgba(0,0,0,.48);
  }
  .heading{
    padding:13px 15px;
    margin-bottom:23px;
    border-radius:12px;
    background:linear-gradient(90deg,rgba(229,43,63,.13),rgba(255,83,99,.05));
    border:1px solid rgba(229,43,63,.18);
    text-align:center;
    font-size:14px;
    color:#d9d9df;
  }
  .heading b{color:#ff5868}
  label{
    display:block;
    margin:0 0 8px;
    font-size:12px;
    font-weight:800;
    letter-spacing:.7px;
    color:#d8d8dd;
  }
  .field{margin-bottom:18px}
  .input-wrap{position:relative}
  input{
    width:100%;
    height:55px;
    border-radius:12px;
    border:1px solid var(--line);
    outline:none;
    background:var(--field);
    color:var(--text);
    padding:0 48px 0 16px;
    font-size:15px;
    transition:.2s ease;
  }
  input:focus{
    border-color:rgba(255,83,99,.75);
    box-shadow:0 0 0 3px rgba(229,43,63,.10);
  }
  input::placeholder{color:#707079}
  .eye{
    position:absolute;
    right:10px;top:50%;
    transform:translateY(-50%);
    width:35px;height:35px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#9999a2;
    cursor:pointer;
    font-size:16px;
  }
  .eye:hover{background:#202027;color:white}
  .register{
    width:100%;
    height:55px;
    border:0;
    border-radius:12px;
    color:white;
    font-weight:850;
    font-size:15px;
    letter-spacing:.5px;
    cursor:pointer;
    background:linear-gradient(135deg,#c91e32,var(--accent),var(--accent2));
    box-shadow:0 12px 28px rgba(229,43,63,.22);
  }
  .register:active{transform:translateY(1px)}
  .note{
    margin-top:16px;
    text-align:center;
    color:#777780;
    font-size:12px;
    line-height:1.5;
  }
  #status{
    display:none;
    margin:0 0 18px;
    padding:12px 14px;
    border-radius:10px;
    font-size:13px;
    line-height:1.45;
    background:#211316;
    border:1px solid #52212a;
    color:#ffb0b8;
  }
  footer{
    text-align:center;
    margin-top:20px;
    color:#676770;
    font-size:11px;
  }
  @media(max-width:420px){
    .wrap{margin-top:28px}
    .card{padding:23px 17px 21px}
    h1{font-size:26px}
  }
</style>
</head>
<body>
  <div class="topbar"></div>

  <main class="wrap">
    <section class="brand">
      <div class="logo">R</div>
      <h1>RG GAMER BOY FF</h1>
      <p>Create your account to continue</p>
    </section>

    <section class="card">
      <div class="heading">Create your account with <b>username and password</b></div>

      <div id="status"></div>

      <form id="registerForm" novalidate>
        <div class="field">
          <label for="username">USERNAME</label>
          <input id="username" name="username" type="text" autocomplete="username"
                 placeholder="Choose a username" maxlength="24" required>
        </div>

        <div class="field">
          <label for="password">PASSWORD</label>
          <div class="input-wrap">
            <input id="password" name="password" type="password" autocomplete="new-password"
                   placeholder="Create a password" minlength="8" required>
            <button class="eye" type="button" data-target="password" aria-label="Show password">◉</button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">CONFIRM PASSWORD</label>
          <div class="input-wrap">
            <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password"
                   placeholder="Confirm your password" minlength="8" required>
            <button class="eye" type="button" data-target="confirmPassword" aria-label="Show password">◉</button>
          </div>
        </div>

        <div class="field">
          <label for="accessKey">ACCESS KEY</label>
          <input id="accessKey" name="accessKey" type="text" autocomplete="off"
                 placeholder="Enter your access key" maxlength="80" required>
        </div>

        <button class="register" type="submit">CREATE ACCOUNT</button>
      </form>

      <div class="note">
        Your account will be securely connected to the authentication system after Firebase is configured.
      </div>
    </section>

    <footer>RG GAMER BOY FF • Account Registration</footer>
  </main>


<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    deleteUser
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import {
    getDatabase,
    ref,
    get,
    set,
    runTransaction
  } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyByc4PP-Tglp-Seynuu8CTllNiQ3PSa1E8",
    authDomain: "rg-gamer-boy-ff-store.firebaseapp.com",
    databaseURL: "https://rg-gamer-boy-ff-store-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "rg-gamer-boy-ff-store",
    storageBucket: "rg-gamer-boy-ff-store.firebasestorage.app",
    messagingSenderId: "1057271668760",
    appId: "1:1057271668760:web:cf404473d0ab32171c236d",
    measurementId: "G-YTXTLFW0NV"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  window.RG_FIREBASE = {
    auth, db, ref, get, set, runTransaction,
    createUserWithEmailAndPassword, deleteUser
  };
</script>

<script>
  const form = document.getElementById('registerForm');
  const statusBox = document.getElementById('status');

  function showStatus(message){
    statusBox.textContent = message;
    statusBox.style.display = 'block';
  }

  document.querySelectorAll('.eye').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.textContent = input.type === 'password' ? '◉' : '◎';
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusBox.style.display = 'none';

    const username = document.getElementById('username').value.trim();
    const usernameLower = username.toLowerCase();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirmPassword').value;
    const key = document.getElementById('accessKey').value
      .trim()
      .toUpperCase()
      .replace(/[\s–—_]+/g, '-')
      .replace(/-+/g, '-');
    const button = form.querySelector('.register');

    if(!username || !password || !confirm || !key){
      showStatus('Please fill in all fields.');
      return;
    }
    if(username.length < 3 || username.length > 24){
      showStatus('Username must contain 3–24 characters.');
      return;
    }
    if(!/^[A-Za-z0-9._-]+$/.test(username)){
      showStatus('Username can use only letters, numbers, dot, underscore and hyphen.');
      return;
    }
    if(password.length < 8){
      showStatus('Password must contain at least 8 characters.');
      return;
    }
    if(password !== confirm){
      showStatus('Passwords do not match.');
      return;
    }

    button.disabled = true;
    button.textContent = 'CHECKING KEY...';

    try {
      const { auth, db, ref, get, set, runTransaction,
              createUserWithEmailAndPassword, deleteUser } = window.RG_FIREBASE;

      // The key generator stores keys under accessKeys/<KEY>.
      const normalizedKey = key.replace(/[^A-Z0-9-]/g, '');
      const keyRef = ref(db, 'accessKeys/' + normalizedKey);
      const keySnap = await get(keyRef);

      if(!keySnap.exists()){
        showStatus('Invalid access key. Please enter the exact key generated by the Access Key website.');
        return;
      }

      const keyData = keySnap.val() || {};
      if(keyData.status !== 'unused'){
        showStatus('This access key has already been used.');
        return;
      }

      // Firebase Auth requires an email for email/password accounts.
      // The user still logs in with their username on the separate login page.
      const syntheticEmail =
        usernameLower + '@users.rg-gamer-boy-ff-store.firebaseapp.com';

      button.textContent = 'CREATING ACCOUNT...';

      const credential = await createUserWithEmailAndPassword(
        auth,
        syntheticEmail,
        password
      );

      const uid = credential.user.uid;

      // Atomically consume the key so two users cannot redeem the same key.
      const tx = await runTransaction(keyRef, current => {
        if(!current || current.status !== 'unused') return;
        return {
          status: 'used',
          usedBy: uid,
          usedAt: Date.now()
        };
      });

      if(!tx.committed){
        await deleteUser(credential.user);
        showStatus('This access key was used by another account. Please use a new key.');
        return;
      }

      await set(ref(db, 'users/' + uid), {
        username: username,
        usernameLower: usernameLower,
        createdAt: Date.now()
      });

      await set(ref(db, 'usernames/' + usernameLower), {
        uid: uid
      });

      showStatus('Account created successfully. You can now use your username and password to log in.');
      form.reset();
    } catch(err) {
      console.error(err);

      const messages = {
        'auth/email-already-in-use': 'That username is already registered.',
        'auth/weak-password': 'Password must contain at least 6 characters.',
        'auth/operation-not-allowed': 'Firebase Email/Password Authentication is not enabled.',
        'auth/network-request-failed': 'Network error. Check your internet connection.'
      };

      showStatus(messages[err.code] || 'Account could not be created. Please try again.');
    } finally {
      button.disabled = false;
      button.textContent = 'CREATE ACCOUNT';
    }
  });
</script>
</body>
</html>
